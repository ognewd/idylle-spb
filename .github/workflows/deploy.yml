name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Позволяет запускать вручную из GitHub UI

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /root/idylle-spb
            
            # Удалить конфликтующие файлы (если есть)
            rm -f idylle_spb_backup.sql idylle_spb_data_only.sql 2>/dev/null || true
            
            # Получить последние изменения
            git fetch origin
            git reset --hard origin/main || git pull origin main
            
            # Установить зависимости
            npm install
            
            # Применить миграции Prisma
            npx prisma db push --accept-data-loss || true
            npx prisma generate
            
            # Собрать приложение
            npm run build
            
            # Перезапустить PM2
            pm2 restart idylle-spb || pm2 start ecosystem.config.js || true
            
            # Проверить статус
            pm2 status
            
            echo "✅ Деплой завершен успешно!"

