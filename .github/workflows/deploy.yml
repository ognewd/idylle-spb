name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Позволяет запускать вручную из GitHub UI

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /root/idylle-spb
            
            # Удалить конфликтующие файлы (если есть)
            rm -f idylle_spb_backup.sql idylle_spb_data_only.sql 2>/dev/null || true
            
            # Получить последние изменения
            git fetch origin
            git reset --hard origin/main || git pull origin main
            
            # Установить зависимости
            npm install
            
            # Применить миграции Prisma
            # Убеждаемся, что используем правильный DATABASE_URL (локальный PostgreSQL, не Supabase)
            if [ -f .env ]; then
                export $(grep -v '^#' .env | xargs)
            fi
            
            # Проверяем, что DATABASE_URL указывает на локальный PostgreSQL
            if echo "$DATABASE_URL" | grep -q "supabase\|aws-1-us-east-1"; then
                echo "⚠️  Предупреждение: DATABASE_URL указывает на Supabase, используем локальный fallback"
                export DATABASE_URL="postgresql://idylle_user:wendw%40%40422ewd%21@localhost:5432/idylle_spb?schema=public"
            fi
            
            echo "📊 Применяю миграции Prisma с DATABASE_URL: ${DATABASE_URL%%@*}@***"
            npx prisma db push --accept-data-loss
            npx prisma generate
            
            # Проверяем, что таблица tasks создана
            echo "🔍 Проверка таблицы tasks..."
            npx prisma db execute --stdin <<< "SELECT COUNT(*) FROM tasks;" || echo "⚠️  Предупреждение: не удалось проверить таблицу tasks"
            
            # Создать страницы по умолчанию (если их еще нет)
            npx tsx scripts/seed-pages.ts || echo "⚠️  Предупреждение при создании страниц"
            
            # Очистить старые build файлы перед новой сборкой
            rm -rf .next
            rm -rf node_modules/.cache
            
            # Собрать приложение
            npm run build
            
            # Перезапустить PM2
            pm2 restart idylle-spb || pm2 start ecosystem.config.js || true
            
            # Проверить статус
            pm2 status
            
            # Небольшая задержка для проверки, что приложение запустилось
            sleep 3
            
            # Проверить логи на критические ошибки
            pm2 logs idylle-spb --lines 10 --nostream | grep -i "error\|fatal\|cannot" && echo "⚠️  Обнаружены ошибки в логах" || echo "✅ Логи выглядят нормально"
            
            echo "✅ Деплой завершен успешно!"

