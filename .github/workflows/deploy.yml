name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Позволяет запускать вручную из GitHub UI

jobs:
  # Определяем, что изменилось: только статика (public/) или нужна полная сборка
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      need_full: ${{ steps.filter.outputs.source == 'true' || github.event.before == '0000000000000000000000000000000000000000' || github.event_name == 'workflow_dispatch' }}
      static_only: ${{ steps.filter.outputs.public == 'true' && steps.filter.outputs.source != 'true' && github.event_name != 'workflow_dispatch' }}
      deps_changed: ${{ steps.filter.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            source:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'prisma/**'
              - 'next.config.*'
              - '.github/**'
            public:
              - 'public/**'
            deps:
              - 'package.json'
              - 'package-lock.json'

  # Быстрый деплой: только git pull (картинки/статика в public/) — без сборки, ~1 мин
  deploy-static:
    name: Deploy static only (public/)
    needs: changes
    if: needs.changes.outputs.static_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Sync static files to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /root/idylle-spb
            echo "📥 Обновление только статики (public/)..."
            git fetch origin --prune
            git reset --hard origin/main
            echo "✅ Готово. Next.js отдаёт public/ без перезапуска."

  # Полный деплой: сборка + перезапуск (при изменении кода, зависимостей, prisma)
  deploy:
    name: Deploy to VPS (full build)
    needs: changes
    if: needs.changes.outputs.need_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPS_CHANGED: ${{ needs.changes.outputs.deps_changed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        timeout-minutes: 22
        with:
          command_timeout: 20m
          envs: DEPS_CHANGED
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Выходим при первой ошибке
            
            cd /root/idylle-spb
            
            echo "🔄 Начало деплоя..."
            
            # Сохранить ecosystem.config.cjs перед git reset (если существует)
            if [ -f ecosystem.config.cjs ]; then
                echo "💾 Сохраняю ecosystem.config.cjs перед git reset..."
                cp ecosystem.config.cjs /tmp/ecosystem.config.cjs.backup
            fi
            
            # Удалить конфликтующие файлы (если есть)
            rm -f idylle_spb_backup.sql idylle_spb_data_only.sql 2>/dev/null || true
            
            # Получить последние изменения
            echo "📥 Получение изменений из Git..."
            git fetch origin --prune
            git reset --hard origin/main || git pull origin main
            
            # Восстановить ecosystem.config.cjs после git reset (если был сохранен)
            if [ -f /tmp/ecosystem.config.cjs.backup ]; then
                echo "💾 Восстанавливаю ecosystem.config.cjs после git reset..."
                cp /tmp/ecosystem.config.cjs.backup ecosystem.config.cjs
                rm /tmp/ecosystem.config.cjs.backup
                
                # Проверяем и исправляем старую конфигурацию (npm start -> прямой путь к next)
                if grep -q '"script":\s*"npm"' ecosystem.config.cjs || grep -q "'script':\s*'npm'" ecosystem.config.cjs; then
                    echo "🔧 Обновляю ecosystem.config.cjs: заменяю npm start на прямой путь к next..."
                    sed -i "s|script: 'npm'|script: '/root/idylle-spb/node_modules/.bin/next'|g" ecosystem.config.cjs
                    sed -i 's|args: 'start'|args: 'start'|g' ecosystem.config.cjs
                    sed -i "s|interpreter: 'node'|interpreter: 'node'|g" ecosystem.config.cjs || echo "interpreter: 'node'," >> ecosystem.config.cjs
                fi
            elif [ -f ecosystem.config.cjs.example ]; then
                echo "⚠️  ecosystem.config.cjs не найден, создаю из примера..."
                cp ecosystem.config.cjs.example ecosystem.config.cjs
            fi
            
            # Проверяем и исправляем DATABASE_URL в .env перед обновлением ecosystem.config.cjs
            echo "🔍 Проверяю DATABASE_URL в .env..."
            if [ -f .env ] && grep -q "^DATABASE_URL=" .env; then
                DB_URL_FROM_ENV=$(grep "^DATABASE_URL=" .env | head -1 | cut -d'=' -f2- | sed "s/^[\"']//;s/[\"']$//")
                if echo "$DB_URL_FROM_ENV" | grep -qE "supabase|aws-1-us-east-1\.pooler\.supabase"; then
                    echo "⚠️  Обнаружен Supabase DATABASE_URL в .env, исправляю на локальный PostgreSQL..."
                    CORRECT_DB_URL="postgresql://idylle_user:wendw%40%40422ewd%21@localhost:5432/idylle_spb?schema=public"
                    sed -i "s|^DATABASE_URL=.*|DATABASE_URL=\"${CORRECT_DB_URL}\"|" .env
                    echo "  ✓ DATABASE_URL исправлен в .env"
                fi
            fi
            
            # Обновить ecosystem.config.cjs с переменными из .env
            echo "🔧 Обновляю ecosystem.config.cjs с переменными из .env..."
            if [ -f scripts/update-ecosystem-env.sh ]; then
                chmod +x scripts/update-ecosystem-env.sh
                bash scripts/update-ecosystem-env.sh || echo "⚠️  Предупреждение: не удалось обновить ecosystem.config.cjs"
            else
                echo "⚠️  Скрипт update-ecosystem-env.sh не найден, пропускаю обновление"
            fi
            
            # Установить зависимости (пропускаем npm ci, если менялся только код — экономия 2–4 мин)
            if [ "$DEPS_CHANGED" = "false" ]; then
                echo "📦 Зависимости не менялись, пропускаю npm ci"
            else
                echo "📦 Установка зависимостей..."
                if ! npm ci --prefer-offline --no-audit; then
                    echo "⚠️  npm ci не удался, используем npm install..."
                    npm install --no-audit
                fi
            fi
            
            if [ -f .env ]; then
                export $(grep -v '^#' .env | xargs)
            fi
            echo "📊 Применяю миграции Prisma с DATABASE_URL: ${DATABASE_URL%%@*}@***"
            
            # Применяем миграции (без --accept-data-loss, если возможно)
            # Используем migrate deploy если есть миграции, иначе db push
            # ВАЖНО: --accept-data-loss может удалить данные, поэтому используем только migrate deploy
            if [ -d "prisma/migrations" ] && [ "$(ls -A prisma/migrations 2>/dev/null)" ]; then
                echo "🔄 Используем миграции..."
                npx prisma migrate deploy || {
                    echo "⚠️  Ошибка при применении миграций, но продолжаем..."
                    # НЕ используем db push --accept-data-loss, чтобы не потерять данные
                }
            else
                echo "🔄 Нет миграций, пропускаем..."
            fi
            
            npx prisma generate
            
            # Создать страницы по умолчанию (если их еще нет)
            echo "📄 Создание страниц..."
            npx tsx scripts/seed-pages.ts || echo "⚠️  Предупреждение при создании страниц"
            
            # Очистить старые build файлы перед новой сборкой
            echo "🧹 Очистка старых файлов сборки..."
            # Более агрессивная очистка для предотвращения ошибок webpack
            rm -rf .next
            rm -rf node_modules/.cache
            # Удаляем возможные поврежденные файлы
            find .next -type f -name "*.js.map" -delete 2>/dev/null || true
            find .next -type d -name "chunks" -exec rm -rf {} + 2>/dev/null || true
            
            # Собрать приложение
            echo "🔨 Сборка приложения..."
            echo "⏱️  Начало сборки: $(date)"
            # Сохраняем вывод сборки для диагностики
            if ! npm run build 2>&1 | tee /tmp/build.log; then
                echo "❌ Ошибка при сборке!"
                echo "📋 Последние 50 строк логов сборки:"
                tail -50 /tmp/build.log || true
                echo "📋 Проверяю логи PM2:"
                pm2 logs idylle-spb --lines 20 --nostream || true
                echo "📋 Проверяю наличие .next директории:"
                ls -la .next/ 2>/dev/null | head -20 || echo "  .next директория не найдена"
                exit 1
            fi
            echo "⏱️  Сборка завершена: $(date)"
            
            # Проверить, что сборка успешна (проверить наличие .next/BUILD_ID)
            if [ ! -f .next/BUILD_ID ]; then
                echo "❌ Ошибка: .next/BUILD_ID не найден после сборки!"
                exit 1
            fi
            echo "✅ Сборка успешна, BUILD_ID: $(cat .next/BUILD_ID)"
            
            # Проверить, что зависимости установлены
            echo "🔍 Проверка установки зависимостей..."
            if [ ! -d "node_modules" ] || [ ! -f "node_modules/.bin/next" ]; then
                echo "⚠️  Зависимости не установлены или повреждены, переустанавливаю..."
                npm ci --prefer-offline --no-audit
            fi
            
            # Проверить наличие next
            if [ ! -f "node_modules/.bin/next" ]; then
                echo "❌ Ошибка: next не найден после установки зависимостей!"
                echo "📋 Проверяю node_modules..."
                ls -la node_modules/.bin/ | grep next || echo "❌ next отсутствует в node_modules/.bin/"
                exit 1
            fi
            echo "✅ next найден: $(which next || echo 'node_modules/.bin/next')"
            
            # Перезапустить PM2 с обновленными переменными окружения
            echo "🔄 Перезапуск приложения..."
            if [ -f ecosystem.config.cjs ]; then
                # Проверяем синтаксис ecosystem.config.cjs перед запуском
                if node -c ecosystem.config.cjs 2>/dev/null; then
                    echo "✅ Синтаксис ecosystem.config.cjs корректен"
                else
                    echo "❌ ОШИБКА: Синтаксическая ошибка в ecosystem.config.cjs!"
                    echo "📋 Проверяю файл:"
                    cat ecosystem.config.cjs | head -20
                    echo ""
                    echo "⚠️  Пытаюсь исправить..."
                    # Запускаем скрипт обновления еще раз
                    if [ -f scripts/update-ecosystem-env.sh ]; then
                        bash scripts/update-ecosystem-env.sh || true
                    fi
                fi
                
                pm2 delete idylle-spb 2>/dev/null || true
                pm2 start ecosystem.config.cjs
                pm2 save
            else
                # Если нет ecosystem.config.cjs, используем прямой путь к next
                pm2 delete idylle-spb 2>/dev/null || true
                pm2 start node_modules/.bin/next --name idylle-spb -- start --update-env || {
                    echo "⚠️  Попытка альтернативного запуска..."
                    pm2 start npm --name idylle-spb -- start --update-env || true
                }
                pm2 save
            fi
            
            # Проверить статус
            echo "📊 Статус PM2:"
            pm2 status
            
            # Небольшая задержка для проверки, что приложение запустилось
            sleep 3
            
            # Проверить логи на критические ошибки
            echo "📋 Проверка логов..."
            pm2 logs idylle-spb --lines 10 --nostream | grep -i "error\|fatal\|cannot" && echo "⚠️  Обнаружены ошибки в логах" || echo "✅ Логи выглядят нормально"
            
            # Проверка подключения к БД
            echo ""
            echo "🔍 Проверка подключения к базе данных..."
            if [ -f scripts/check-db-connection.sh ]; then
                chmod +x scripts/check-db-connection.sh
                bash scripts/check-db-connection.sh || echo "⚠️  Предупреждение при проверке БД"
            fi
            
            # Финальная проверка здоровья приложения
            echo ""
            echo "🏥 Финальная проверка здоровья приложения..."
            chmod +x scripts/health-check.sh
            if ./scripts/health-check.sh; then
                echo "✅ Все проверки здоровья пройдены!"
            else
                echo "❌ Проверка здоровья выявила проблемы!"
                echo "📋 Последние логи PM2:"
                pm2 logs idylle-spb --lines 30 --nostream || true
                exit 1
            fi
            
            echo "✅ Деплой завершен успешно!"
