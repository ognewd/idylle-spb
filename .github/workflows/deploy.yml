name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Позволяет запускать вручную из GitHub UI

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Увеличен таймаут до 20 минут
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        timeout-minutes: 18 # Увеличен таймаут SSH до 18 минут
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Выходим при первой ошибке
            
            cd /root/idylle-spb
            
            echo "🔄 Начало деплоя..."
            
            # Сохранить ecosystem.config.cjs перед git reset (если существует)
            if [ -f ecosystem.config.cjs ]; then
                echo "💾 Сохраняю ecosystem.config.cjs перед git reset..."
                cp ecosystem.config.cjs /tmp/ecosystem.config.cjs.backup
            fi
            
            # Удалить конфликтующие файлы (если есть)
            rm -f idylle_spb_backup.sql idylle_spb_data_only.sql 2>/dev/null || true
            
            # Получить последние изменения
            echo "📥 Получение изменений из Git..."
            git fetch origin --prune
            git reset --hard origin/main || git pull origin main
            
            # Восстановить ecosystem.config.cjs после git reset (если был сохранен)
            if [ -f /tmp/ecosystem.config.cjs.backup ]; then
                echo "💾 Восстанавливаю ecosystem.config.cjs после git reset..."
                cp /tmp/ecosystem.config.cjs.backup ecosystem.config.cjs
                rm /tmp/ecosystem.config.cjs.backup
            elif [ -f ecosystem.config.cjs.example ]; then
                echo "⚠️  ecosystem.config.cjs не найден, создаю из примера..."
                echo "⚠️  ВАЖНО: Отредактируйте ecosystem.config.cjs на сервере с правильным DATABASE_URL!"
                cp ecosystem.config.cjs.example ecosystem.config.cjs
            fi
            
            # Установить зависимости
            echo "📦 Установка зависимостей..."
            npm ci --prefer-offline --no-audit
            
            # Установить sharp для оптимизации изображений (рекомендуется Next.js)
            echo "📦 Установка sharp для оптимизации изображений..."
            npm install sharp --save --no-audit || echo "⚠️  Не удалось установить sharp, продолжаем без него"
            
            if [ -f .env ]; then
                export $(grep -v '^#' .env | xargs)
            fi
            echo "📊 Применяю миграции Prisma с DATABASE_URL: ${DATABASE_URL%%@*}@***"
            
            # Применяем миграции (без --accept-data-loss, если возможно)
            # Используем migrate deploy если есть миграции, иначе db push
            # ВАЖНО: --accept-data-loss может удалить данные, поэтому используем только migrate deploy
            if [ -d "prisma/migrations" ] && [ "$(ls -A prisma/migrations 2>/dev/null)" ]; then
                echo "🔄 Используем миграции..."
                npx prisma migrate deploy || {
                    echo "⚠️  Ошибка при применении миграций, но продолжаем..."
                    # НЕ используем db push --accept-data-loss, чтобы не потерять данные
                }
            else
                echo "🔄 Нет миграций, пропускаем..."
            fi
            
            npx prisma generate
            
            # Создать страницы по умолчанию (если их еще нет)
            echo "📄 Создание страниц..."
            npx tsx scripts/seed-pages.ts || echo "⚠️  Предупреждение при создании страниц"
            
            # Очистить старые build файлы перед новой сборкой
            echo "🧹 Очистка старых файлов сборки..."
            rm -rf .next
            rm -rf node_modules/.cache
            
            # Собрать приложение
            echo "🔨 Сборка приложения..."
            echo "⏱️  Начало сборки: $(date)"
            if ! npm run build; then
                echo "❌ Ошибка при сборке!"
                echo "📋 Проверяю логи сборки..."
                pm2 logs idylle-spb --lines 20 --nostream || true
                exit 1
            fi
            echo "⏱️  Сборка завершена: $(date)"
            
            # Проверить, что сборка успешна (проверить наличие .next/BUILD_ID)
            if [ ! -f .next/BUILD_ID ]; then
                echo "❌ Ошибка: .next/BUILD_ID не найден после сборки!"
                exit 1
            fi
            echo "✅ Сборка успешна, BUILD_ID: $(cat .next/BUILD_ID)"
            
            # Проверить, что зависимости установлены
            echo "🔍 Проверка установки зависимостей..."
            if [ ! -d "node_modules" ] || [ ! -f "node_modules/.bin/next" ]; then
                echo "⚠️  Зависимости не установлены или повреждены, переустанавливаю..."
                npm ci --prefer-offline --no-audit
            fi
            
            # Проверить наличие next
            if [ ! -f "node_modules/.bin/next" ]; then
                echo "❌ Ошибка: next не найден после установки зависимостей!"
                echo "📋 Проверяю node_modules..."
                ls -la node_modules/.bin/ | grep next || echo "❌ next отсутствует в node_modules/.bin/"
                exit 1
            fi
            echo "✅ next найден: $(which next || echo 'node_modules/.bin/next')"
            
            # Перезапустить PM2
            echo "🔄 Перезапуск приложения..."
            if [ -f ecosystem.config.cjs ]; then
                pm2 delete idylle-spb 2>/dev/null || true
                pm2 start ecosystem.config.cjs
            else
                # Если нет ecosystem.config.cjs, используем прямой путь к next
                pm2 delete idylle-spb 2>/dev/null || true
                pm2 start node_modules/.bin/next --name idylle-spb -- start --update-env || {
                    echo "⚠️  Попытка альтернативного запуска..."
                    pm2 start npm --name idylle-spb -- start --update-env || true
                }
            fi
            
            # Проверить статус
            echo "📊 Статус PM2:"
            pm2 status
            
            # Небольшая задержка для проверки, что приложение запустилось
            sleep 3
            
            # Проверить логи на критические ошибки
            echo "📋 Проверка логов..."
            pm2 logs idylle-spb --lines 10 --nostream | grep -i "error\|fatal\|cannot" && echo "⚠️  Обнаружены ошибки в логах" || echo "✅ Логи выглядят нормально"
            
            # Финальная проверка здоровья приложения
            echo ""
            echo "🏥 Финальная проверка здоровья приложения..."
            chmod +x scripts/health-check.sh
            if ./scripts/health-check.sh; then
                echo "✅ Все проверки здоровья пройдены!"
            else
                echo "❌ Проверка здоровья выявила проблемы!"
                echo "📋 Последние логи PM2:"
                pm2 logs idylle-spb --lines 30 --nostream || true
                exit 1
            fi
            
            echo "✅ Деплой завершен успешно!"
